---
- name: Configure node for access to the EESSI stack
  hosts: localhost
  gather_facts: true
  tasks:
    - name: Install prerequisites
      apt:
        name:
          - sudo
          - wget
        state: present

    - name: Download EESSI installation script
      get_url:
        url: https://raw.githubusercontent.com/EESSI/eessi-demo/23da78bd7cc56332cceb9567bf67be637af91946/scripts/install_cvmfs_eessi.sh
        dest: /tmp/install_cvmfs_eessi.sh
        mode: '0755'

    - name: Execute the installation script
      shell: /tmp/install_cvmfs_eessi.sh

    - name: Verify cvmfs_talk command
      shell: "command -v cvmfs_talk"
      register: cvmfs_talk_output
      ignore_errors: true

    - name: Fail if cvmfs_talk command not found
      fail:
        msg: "'cvmfs_talk' command is not available. EESSI client installation failed."
      when: cvmfs_talk_output.rc != 0

    - name: Add private Stratum 1 to list of Stratum 1s
      when: src_stratum1_host is defined
      block:
        - name: Copy domain template
          copy:
            src: ../files/template-eessi-hpc.org.local
            dest: /etc/cvmfs/domain.d/eessi-hpc.org.local
            force: true
            mode: '0664'

        - name: Substitute template variables with values
          replace:
            path: /etc/cvmfs/domain.d/eessi-hpc.org.local
            regexp: "{{ item.variable }}"
            replace: "{{ item.value }}"
          loop:
            - { variable: "_src_stratum1_host_", value: "{{ src_stratum1_host }}" }

        - name: Update EESSI configuration
          shell: cvmfs_config probe pilot.eessi-hpc.org

        - name: Probe Stratum 1 servers by geo location to trigger reordering
          shell: cvmfs_talk -i pilot.eessi-hpc.org host probe geo

- name: Install and configure JupyterHub (CHP) with EESSI-backed user servers
  hosts: localhost
  become: true
  gather_facts: true

  vars:
    eessi_version: "2023.06"
    eessi_python_module: "Python/3.11.3-GCCcore-13.2.0" 
    eessi_lab_module:    "JupyterLab/4.0.5-GCCcore-12.3.0"
    eessi_nb_module:     "JupyterNotebook/7.0.2-GCCcore-12.3.0"

    jupyter_nginx_location: "/"

  tasks:
    - name: Base OS deps (incl. autofs so /cvmfs works)
      apt:
        name:
          - apt-transport-https
          - python3
          - python3-setuptools
          - python3-pip
          - jq
          - curl
          - ca-certificates
          - gnupg
          - autofs
        state: present
        update_cache: yes

    - name: Ensure autofs is enabled (mount /cvmfs on-demand)
      systemd:
        name: autofs
        state: started
        enabled: true

    - name: Create keyrings dir
      file:
        path: /etc/apt/keyrings
        state: directory

    - name: Install NodeSource GPG key
      shell: >
        curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
        | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
      args: { executable: /bin/bash }

    - name: Add NodeSource repository (Node 20)
      shell: >
        echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_20.x nodistro main"
        | tee /etc/apt/sources.list.d/nodesource.list
      args: { executable: /bin/bash }

    - name: Remove conflicting libnode package (if present)
      apt:
        name: libnode72
        state: absent

    - name: Install Node.js
      apt:
        name: nodejs
        update_cache: yes

    - name: Install configurable-http-proxy (CHP)
      npm:
        global: yes
        name: configurable-http-proxy
        version: '4.5.5'

    - name: Create JupyterHub installation script using EESSI
      copy:
        dest: /tmp/install_jupyterhub_eessi.sh
        mode: "0755"
        content: |
          #!/bin/bash
          set -eo pipefail
          
          echo "Loading EESSI environment..."
          if [ -f "/cvmfs/software.eessi.io/versions/{{ eessi_version }}/init/bash" ]; then
            source /cvmfs/software.eessi.io/versions/{{ eessi_version }}/init/bash
          else
            echo "EESSI init script not found"; exit 1
          fi
          
          echo "Loading Python module..."
          module purge || true
          module load {{ eessi_python_module }}
          
          echo "Python version: $(python --version)"
          echo "Python path: $(which python)"
          
          echo "Installing JupyterHub and dependencies in EESSI Python..."
          pip install \
            jupyterhub==4.0.1 \
            jsonschema>=4.0.0 \
            Jinja2==3.0.3 \
            markupsafe==2.0.1 \
            jupyterlab==4.3.5 \
            virtualenv==20.24.2 \
            jupyterlab-git \
            jhub-remote-user-authenticator==0.1.0 \
            traitlets==5.9.0 \
            nbdime
          
          echo "JupyterHub installation completed successfully"

    - name: Execute JupyterHub installation in EESSI
      shell: /tmp/install_jupyterhub_eessi.sh
      register: jupyterhub_install_output

    - name: Display JupyterHub installation output
      debug:
        var: jupyterhub_install_output

    - name: Create JupyterHub wrapper script
      copy:
        dest: /usr/local/bin/jupyterhub-eessi
        mode: "0755"
        content: |
          #!/usr/bin/env bash
          set -eo pipefail
          
          # Load EESSI
          if [ -f "/cvmfs/software.eessi.io/versions/{{ eessi_version }}/init/bash" ]; then
            source /cvmfs/software.eessi.io/versions/{{ eessi_version }}/init/bash
          else
            echo "EESSI init script not found"; exit 1
          fi
          
          # Load Python module
          module load {{ eessi_python_module }}
          
          # Run JupyterHub from EESSI environment
          exec jupyterhub "$@"

    - name: Create EESSI single-user wrapper
      copy:
        dest: /usr/local/bin/jupyter-eessi.sh
        mode: "0755"
        content: |
          #!/usr/bin/env bash
          set -eo pipefail

          # Load EESSI
          if [ -f "/cvmfs/software.eessi.io/versions/{{ eessi_version }}/init/bash" ]; then
            source /cvmfs/software.eessi.io/versions/{{ eessi_version }}/init/bash
          else
            echo "EESSI init script not found"; exit 1
          fi

          module purge || true
          module load {{ eessi_python_module }} || true
          # Load both so either UI works; Hub sets the port/IP.
          module load {{ eessi_lab_module }} || true
          #module load {{ eessi_nb_module }} || true
          
          # Find jupyterhub-singleuser (should be in PATH after loading EESSI)
          if command -v jupyterhub-singleuser >/dev/null 2>&1; then
            JUPYTERHUB_SINGLEUSER="jupyterhub-singleuser"
          elif [ -f "/root/.local/bin/jupyterhub-singleuser" ]; then
            JUPYTERHUB_SINGLEUSER="/root/.local/bin/jupyterhub-singleuser"
          elif [ -f "$HOME/.local/bin/jupyterhub-singleuser" ]; then
            JUPYTERHUB_SINGLEUSER="$HOME/.local/bin/jupyterhub-singleuser"
          else
            echo "ERROR: jupyterhub-singleuser not found in expected locations"
            echo "Checked PATH, /root/.local/bin/, and $HOME/.local/bin/"
            echo "Available Python packages:"
            pip list | grep -i jupyter || true
            exit 1
          fi

          echo "Using jupyterhub-singleuser from: $JUPYTERHUB_SINGLEUSER"
          # Use the found jupyterhub-singleuser
          exec "$JUPYTERHUB_SINGLEUSER" \
            --ServerApp.default_url=/lab \
            --ServerApp.trust_xheaders=True \
            "$@"


    - name: Ensure JupyterHub config directory exists
      file:
        path: /etc/jupyterhub/
        state: directory

    - name: Write jupyterhub_config.py (uses CHP; spawns via EESSI wrapper)
      copy:
        dest: /etc/jupyterhub/jupyterhub_config.py
        mode: "0644"
        content: |
          c = get_config()
          c.JupyterHub.bind_url = "http://127.0.0.1:8000"

          # Upstream auth via Nginx auth_request (REMOTE_USER)
          c.JupyterHub.authenticator_class = "jhub_remote_user_authenticator.remote_user_auth.RemoteUserAuthenticator"
          c.RemoteUserAuthenticator.header_name = "REMOTE_USER"

          # Spawn notebooks via EESSI modules
          c.JupyterHub.spawner_class = "jupyterhub.spawner.LocalProcessSpawner"
          c.Spawner.cmd = ["/usr/local/bin/jupyter-eessi.sh"]
          c.Spawner.default_url = "/lab"

          # Increase timeout to allow for EESSI module loading
          c.Spawner.http_timeout = 60
          c.Spawner.start_timeout = 60

    - name: Ensure systemd unit directory exists (for Debian/Ubuntu)
      file:
        path: /usr/lib/systemd/system
        state: directory

    - name: Install JupyterHub systemd unit
      copy:
        dest: /usr/lib/systemd/system/jupyterhub.service
        mode: "0644"
        content: |
          [Unit]
          Description=JupyterHub daemon (CHP) with EESSI user servers
          After=network.target autofs.service
          Requires=autofs.service

          [Service]
          Type=simple
          ExecStart=/usr/local/bin/jupyterhub-eessi --config=/etc/jupyterhub/jupyterhub_config.py
          Restart=on-failure
          RestartSec=42s
          # Ensure EESSI is available
          Environment=PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

          [Install]
          WantedBy=multi-user.target

    - name: Reload and start JupyterHub
      systemd:
        state: restarted
        daemon_reload: yes
        name: jupyterhub
        enabled: yes

- name: Keep Nginx reverse proxy exactly as you have it
  hosts: localhost
  become: true
  gather_facts: false

  vars:
    jupyter_nginx_location: "/"

  tasks:
    - name: Create nginx location block
      copy:
        dest: /etc/nginx/app-location-conf.d/jupyterhub.conf
        mode: 0644
        content: |
          location {{ jupyter_nginx_location|default('/') }} {
              error_page 401 = @custom_401;
              auth_request /validate;
              auth_request_set $username $upstream_http_username;
              proxy_set_header REMOTE_USER $username;
              proxy_pass http://127.0.0.1:8000;
              proxy_redirect http://localhost:8000/ $scheme://$host/;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header Host $host;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection $connection_upgrade;
              client_max_body_size 10G;
          }

    - name: Restart nginx
      service:
        name: nginx
        state: restarted
